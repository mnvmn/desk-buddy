<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1672">
<title>Desk-buddy · e-paper panel (weather + travel)</title>
<link rel="stylesheet" href="./panel_v2/panel_v2.css">
</head>
<body>
<div class="page">
  <div class="bar">
    <div class="title">Desk-buddy · e-paper panel <span>/ 800&times;272 1-bit · weather + travel (click to switch)</span></div>
    <div class="pill" id="pill"><span class="dot"></span><span id="pillTxt">LOADING&hellip;</span></div>
  </div>
  <div class="device"><canvas id="panel" width="800" height="272"></canvas></div>
  <div class="foot">
    <div>Source: <b id="srcTxt">&mdash;</b></div>
    <div>1-bit e-ink · paper #e9e7df / ink #18191c · 2&times; nearest-neighbour scale · <b>click the panel</b>: weather &harr; travel</div>
  </div>
</div>

<!-- v2 design, split into modules in ./panel_v2/.
     1:1 firmware port of the primitives (setPx/fillRect/thickLine/fillCircle,
     GLYPHS, putText, fmtNum) + the v2 layout (2-day rain strip, left-column
     CURRENT INFO rows, moon phase).
     Classic ordered <script> tags (NOT ES modules) because this file is opened
     via file://, where module scripts are CORS-blocked. Load order is fixed:
     canvas -> font -> icons -> ui -> data -> travel_icons -> travel_ui ->
     travel_data -> app. All share the global scope; cross-module reads live in
     function bodies, resolved once app.js boot() runs. (travel_data.js reads
     params/MODE from data.js, so it must load after it.)
     Two views over one shared canvas: WEATHER = icons+ui+data,
     TRAVEL = travel_icons+travel_ui+travel_data; app.js toggles them on a
     panel click (firmware: rotary center-press).
     Query params: ?mode=auto|live|mock  &page=travel  &url=<travel-json>
     (weather: &state=DRY|RAIN|SNOW|STORM  &range=slash|tilde|underscore) -->
<script src="./panel_v2/canvas.js"></script>
<script src="./panel_v2/font.js"></script>
<script src="./panel_v2/icons.js"></script>
<script src="./panel_v2/ui.js"></script>
<script src="./panel_v2/data.js"></script>
<script src="./panel_v2/travel_icons.js"></script>
<script src="./panel_v2/travel_ui.js"></script>
<script src="./panel_v2/travel_data.js"></script>
<script src="./panel_v2/app.js"></script>
</body>
</html>
