<!doctype html>
<html><head><meta charset="utf-8"><title>error page preview</title>

  body{background:#222;display:flex;flex-direction:column;gap:8px;align-items:center;padding:16px;font-family:sans-serif;color:#ccc}
  canvas{image-rendering:pixelated;background:#e9e7df}

<body>
  <div>
    <a href="?state=weather-data">WEATHER / no data</a>

  </div>
  <canvas id="panel" width="800" height="272"></canvas>

  <script>
    const state = new URLSearchParams(location.search).get('state') || 'weather-data';
    const A = {
      'weather-data': ['WEATHER',    'NO WEATHER DATA', 'RETRYING'],
      'weather-conn': ['WEATHER',    'NO CONNECTION',   'CHECK WIFI'],
      'travel-data':  ['KARPATSKA',  'NO TRAVEL DATA',  'DAEMON OFFLINE'],
      'travel-conn':  ['KARPATSKA',  'NO CONNECTION',   'CHECK WIFI'],
    }[state] || ['WEATHER','NO WEATHER DATA','RETRYING'];
    reset();
    drawError(A[0], A[1], A[2]);
    ctx.putImageData(buf, 0, 0);
  </script>
