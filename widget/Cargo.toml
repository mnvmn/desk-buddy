[package]
name = "deskbuddy_widget"
version = "0.1.0"
edition = "2021"
description = "DeskBuddy Windows floating widget — Rust PoC (eframe/egui)"
license = "MIT"

[[bin]]
name = "deskbuddy_widget"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "links",
    "__screenshot",
] }
ureq = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = "symbols"
